<!DOCTYPE html>
<html lang="es">

<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
    --ink:#122B4D;
    --ink-2:#1B4372;
    --amber:#E2A63C;
    --amber-dark:#C68526;
    --bg:#F3F5FA;
    --border:#E3E8F2;
    --muted:#66738D;
    --success:#2E9E6C;
    --danger:#D5504A;
    --radius:18px;
}

body{
    background:
        radial-gradient(circle at top right, rgba(226,166,60,.10), transparent 45%),
        radial-gradient(circle at bottom left, rgba(18,43,77,.05), transparent 40%),
        var(--bg);
    font-family:'Inter',sans-serif;
    color:#1F2937;
    min-height:100vh;
}

h1,h2,h3,h4,h5,.brand-font{
    font-family:'Fraunces',serif;
}

.mono{
    font-family:'JetBrains Mono',monospace;
}

/* NAVBAR */

.navbar-ticket{
    background:linear-gradient(120deg,var(--ink),var(--ink-2))!important;
}

.navbar-ticket .navbar-brand{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:.01em;
}

.navbar-ticket .navbar-brand i{
    color:var(--amber);
    display:inline-block;
    transform:rotate(45deg);
    margin-right:.45rem;
}

.navbar-ticket .nav-link{
    font-weight:500;
    border-radius:999px;
    padding:.5rem 1rem!important;
    transition:background .2s ease;
}

.navbar-ticket .nav-link:hover,
.navbar-ticket .nav-link:focus{
    background:rgba(255,255,255,.12);
}

.navbar-ticket .dropdown-menu{
    border:none;
    border-radius:14px;
    box-shadow:0 12px 30px -10px rgba(18,43,77,.35);
    overflow:hidden;
    padding:.4rem;
}

.navbar-ticket .dropdown-item{
    border-radius:10px;
    padding:.55rem .8rem;
    font-weight:500;
}

.navbar-ticket .dropdown-item:hover{
    background:rgba(226,166,60,.15);
}

/* CARDS */

.card{
    border:none;
    border-radius:var(--radius);
    box-shadow:0 16px 40px -18px rgba(18,43,77,.28);
    overflow:visible;
}

.ticket-header{
    position:relative;
    background:linear-gradient(120deg,var(--ink),var(--ink-2));
    color:#fff;
    border-radius:var(--radius) var(--radius) 0 0;
    padding:1.4rem 1.75rem 1.65rem;
    border-bottom:2px dashed rgba(255,255,255,.35);
    overflow:hidden;
}

.ticket-header h4{
    margin-bottom:.15rem;
    font-weight:600;
}

.ticket-header p{
    margin-bottom:0;
    font-size:.85rem;
    color:rgba(255,255,255,.75);
}

.ticket-header .icon-wrap{
    width:44px;
    height:44px;
    border-radius:12px;
    background:rgba(255,255,255,.14);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:1.25rem;
    margin-right:.85rem;
    flex:none;
}

.notch{
    position:absolute;
    bottom:-12px;
    width:24px;
    height:24px;
    background:var(--bg);
    border-radius:50%;
}

.notch-left{ left:-12px; }
.notch-right{ right:-12px; }

.card-body{
    padding:2rem;
}

/* FORMS */

.form-label{
    font-size:.76rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-weight:700;
    color:var(--muted);
    margin-bottom:.35rem;
}

.form-control,
.form-select{
    border-radius:12px;
    border:1.5px solid var(--border);
    padding:.65rem .9rem;
}

.form-control:focus,
.form-select:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 .2rem rgba(226,166,60,.25);
}

.form-control[readonly]{
    background:#F8FAFD;
}

/* BUTTONS */

.btn{
    border-radius:12px;
    font-weight:600;
    padding:.65rem 1.1rem;
}

.btn-success{
    --bs-btn-bg:var(--success);
    --bs-btn-border-color:var(--success);
    --bs-btn-hover-bg:#26875C;
    --bs-btn-hover-border-color:#26875C;
}

.btn-primary{
    --bs-btn-bg:var(--ink);
    --bs-btn-border-color:var(--ink);
    --bs-btn-hover-bg:var(--ink-2);
    --bs-btn-hover-border-color:var(--ink-2);
}

.btn-danger{
    --bs-btn-bg:var(--danger);
    --bs-btn-border-color:var(--danger);
    --bs-btn-hover-bg:#BE3E39;
    --bs-btn-hover-border-color:#BE3E39;
}

/* RESPONSIVE */

@media (max-width: 576px){

    .ticket-header{
        padding:1.15rem 1.25rem 1.4rem;
    }

    .ticket-header h4{
        font-size:1.05rem;
    }

    .card-body{
        padding:1.25rem;
    }

    .btn{
        font-size:.9rem;
        padding:.6rem .9rem;
    }
}

</style>

</head>

<i class="bi bi-airplane-fill"></i>Sistema de Vacaciones
</a>

<button class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item dropdown">

<a class="nav-link dropdown-toggle"
href="#"
role="button"
data-bs-toggle="dropdown">

<i class="bi bi-people me-1"></i>Personal

</a>

<ul class="dropdown-menu dropdown-menu-end">

<li>
<a class="dropdown-item" href="registrarPersonal.html">
<i class="bi bi-person-plus me-2"></i>Registrar Personal
</a>
</li>

<li>
<a class="dropdown-item" href="listaPersonal.html">
<i class="bi bi-list-ul me-2"></i>Listado Personal
</a>
</li>

</ul>

</li>

<li class="nav-item dropdown">

<a class="nav-link dropdown-toggle"
href="#"
role="button"
data-bs-toggle="dropdown">

<i class="bi bi-calendar2-week me-1"></i>Vacaciones

</a>

<ul class="dropdown-menu dropdown-menu-end">

<li>
<a class="dropdown-item" href="registrarVacaciones.html">
<i class="bi bi-calendar2-plus me-2"></i>Registrar Vacaciones
</a>
</li>

<li>
<a class="dropdown-item" href="vacaciones.html">
<i class="bi bi-list-ul me-2"></i>Listado Vacaciones
</a>
</li>

</ul>

</li>

</ul>

</div>

</div>

</nav>

<div class="container mt-4 mt-md-5 pb-5">

<div class="row justify-content-center">

<div class="col-12 col-lg-8 col-xl-7">

<div class="card mb-5">

<div class="ticket-header d-flex align-items-center">

<span class="notch notch-left"></span>
<span class="notch notch-right"></span>

<span class="icon-wrap">
<i class="bi bi-person-plus-fill" id="headerIcon"></i>
</span>

<div>
<h4 id="headerTitulo">Registrar Personal</h4>
<p id="headerDescripcion">Agrega un nuevo colaborador al sistema</p>
</div>

</div>

<div class="card-body">

<form id="formPersonal">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Nombre completo</label>
<input
type="text"
id="nombre"
class="form-control"
placeholder="Ej. María Fernández Rojas"
required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Cédula</label>
<input
type="text"
id="cedula"
class="form-control mono"
placeholder="Ej. 1-1234-5678"
required>
</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Puesto / Ocupación</label>
<input
type="text"
id="puesto"
class="form-control"
placeholder="Ej. Asistente Administrativo"
required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Correo electrónico</label>
<input
type="email"
id="correo"
class="form-control"
placeholder="Ej. maria.fernandez@empresa.com"
required>
</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Número de teléfono</label>
<input
type="text"
id="telefono"
class="form-control"
placeholder="Ej. 8888-8888"
required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Fecha de ingreso</label>
<input
type="date"
id="fechaIngreso"
class="form-control"
required>
</div>

</div>

<div class="mb-3">
<label class="form-label">Dirección</label>
<textarea
id="direccion"
class="form-control"
placeholder="Dirección exacta de residencia"
rows="3"
required></textarea>
</div>

<div class="mb-4 col-md-6">
<label class="form-label">Saldo actual de vacaciones</label>
<input
type="number"
id="saldoVacaciones"
class="form-control mono"
placeholder="0"
min="0"
required>
</div>

<button class="btn btn-success btn-lg w-100" id="btnGuardar">
<i class="bi bi-check2-circle me-2" id="btnGuardarIcono"></i><span id="btnGuardarTexto">Guardar Personal</span>
</button>

</form>

</div>

</div>

</div>

</div>

</div>

<script src="config.js"></script>
<script src="registrarPersonal.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
